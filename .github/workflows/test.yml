name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest flake8
      - name: Lint
        run: flake8 escrow_engine.py evaluator.py escrow_sdk.py app.py --max-line-length=120
      - name: Test
        run: pytest tests/ -v

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Solidity
        run: |
          pip install solc
          solc --version
          solc contracts/ArcAgentEscrow.sol --abi --bin
